<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة النطق</title>
<style>
  :root{--bg:#0e1113;--card:#171b1e;--line:#2a3136;--ink:#eef2f3;--dim:#93a1a8;--acc:#6ee7f9;--ok:#9be37a}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Geeza Pro",Tahoma,sans-serif;padding:24px;max-width:980px;margin-inline:auto}
  h1{font-size:22px;margin:0 0 6px} p{color:var(--dim);margin:0 0 16px;line-height:1.7}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  select,input,button{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  input{direction:ltr} button{cursor:pointer} button:hover{border-color:var(--acc)}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .row h2{font-size:16px;margin:0 0 10px;color:var(--dim);display:flex;gap:10px;align-items:center}
  .chosen{color:var(--ok);font-size:14px}
  .opt{display:inline-flex;gap:4px;margin:0 0 8px 8px;border:1px solid var(--line);border-radius:12px;padding:4px}
  .opt button{border:none;padding:6px 10px}
  .opt .use{color:var(--ok);font-size:13px}
  .opt.sel{border-color:var(--ok)}
  .playing{color:var(--acc)!important}
  #warn{color:#ff8b8b}
</style>
</head>
<body>
<h1>تجربة نطق المصطلحات</h1>
<p>اضغطي ▶ لتسمعي كل طريقة كتابة، ثم اضغطي <b>اعتمد</b> على الأوضح. يُحفظ اختيارك تلقائياً، وتستخدمه الشخصية فوراً.</p>
<div class="bar">
  <label>الصوت: <select id="voiceSel"><option value="main">الصوت الحالي (أمل)</option><option value="other">صوت آخر للمقارنة</option></select></label>
  <input id="otherVoice" placeholder="Voice ID للصوت الآخر (مثل علي)" style="min-width:260px">
  <label>النموذج: <select id="model"><option value="eleven_multilingual_v2">Multilingual v2</option><option value="eleven_v3">Eleven v3</option><option value="eleven_flash_v2_5">Flash v2.5 (الأسرع)</option></select></label>
</div>
<div class="bar">
  <input id="free" placeholder="اكتبي أي جملة لتجربتها" style="flex:1;min-width:240px;direction:rtl">
  <button id="playFree">▶ تشغيل</button>
  <span id="warn"></span>
</div>
<div id="list"></div>
<script>
const WORDS=[
 ["بثينة",["بثينة","بُثينة","بُثَيْنة","بثَينه"]],
 ["الذرة",["الذَّرَّة","الذرّة","الذَرّة","الذرة"]],
 ["وأنا اسمي الذرة",["وأنا اسمي الذَّرَّة","وأنا اسمي الذرّة","وأنا اسمي الذرة"]],
 ["الجذور",["الجذور","الجُذور","الجُذُور"]],
 ["النواة",["النواة","النواه","النَّواة"]],
 ["الإلكترونات",["الإلكترونات","الالكترونات","الإلِكترونات","الإليكترونات"]],
 ["البروتونات",["البروتونات","البرُوتونات","البْروتونات"]],
 ["النيوترونات",["النيوترونات","النيُوترونات","النيترونات"]],
 ["مستويات الطاقة",["مستويات الطاقة","مُستويات الطاقة"]],
 ["قلبي",["قلبي","قَلْبِي","قلْبي"]],
 ["موجبة الشحنة",["موجبة الشحنة","مُوجَبَة الشِّحْنَة","موجَبة الشِّحنة"]],
 ["سالبة",["سالبة","سالِبَة"]],
 ["متعادلة",["متعادلة","مُتَعادِلَة"]]
];
const get=k=>{ try{ return JSON.parse(localStorage.getItem("atom:"+k)); }catch(e){ return null; } };
const set=(k,v)=>{ try{ localStorage.setItem("atom:"+k,JSON.stringify(v)); }catch(e){} };
const elKey=get("elKey"), elVoice=get("elVoice");
if(!elKey||!elVoice) document.getElementById("warn").textContent="لم أجد مفتاح ElevenLabs. افتحي هذه الصفحة من نفس موقع الشخصية بعد إدخال المفتاح فيها.";
const other=document.getElementById("otherVoice"); other.value=get("otherVoice")||""; other.onchange=()=>set("otherVoice",other.value.trim());
let pron=get("pron")||{};
let cur=null;
async function play(text,btn){
  if(cur){ cur.pause(); cur=null; } document.querySelectorAll(".playing").forEach(b=>b.classList.remove("playing"));
  btn&&btn.classList.add("playing");
  const vid=document.getElementById("voiceSel").value==="other"&&other.value.trim()?other.value.trim():elVoice;
  try{
    const r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(vid)}?output_format=mp3_44100_128`,{method:"POST",
      headers:{"xi-api-key":elKey,"Content-Type":"application/json","Accept":"audio/mpeg"},
      body:(()=>{ const m=document.getElementById("model").value; return JSON.stringify(Object.assign({text,model_id:m,seed:4242,voice_settings:{stability:0.8,similarity_boost:0.75,style:0.0,use_speaker_boost:true}},/flash_v2_5|turbo_v2_5|eleven_v3/.test(m)?{language_code:"ar"}:{})); })()});
    if(!r.ok) throw new Error(r.status);
    const a=new Audio(URL.createObjectURL(await r.blob())); cur=a; a.onended=()=>btn&&btn.classList.remove("playing"); a.play();
  }catch(e){ document.getElementById("warn").textContent="تعذّر التشغيل ("+e.message+")"; btn&&btn.classList.remove("playing"); }
}
function render(){
  const list=document.getElementById("list"); list.innerHTML="";
  WORDS.forEach(([w,opts])=>{
    const row=document.createElement("div"); row.className="row";
    const h=document.createElement("h2"); h.textContent=w;
    const ch=document.createElement("span"); ch.className="chosen"; ch.textContent=pron[w]?"المعتمد: "+pron[w]:""; h.appendChild(ch); row.appendChild(h);
    opts.forEach(t=>{
      const o=document.createElement("span"); o.className="opt"+((pron[w]||w)===t?" sel":"");
      const p=document.createElement("button"); p.textContent="▶ "+t; p.onclick=()=>play(t,p);
      const u=document.createElement("button"); u.className="use"; u.textContent="اعتمد"; u.onclick=()=>{ if(t===w) delete pron[w]; else pron[w]=t; set("pron",pron); render(); };
      o.appendChild(p); o.appendChild(u); row.appendChild(o);
    });
    list.appendChild(row);
  });
}
render();
document.getElementById("playFree").onclick=e=>{ const t=document.getElementById("free").value.trim(); if(t) play(t,e.currentTarget); };
</script>
</body>
</html>
