المهمة الأولى: اكتشاف قلبي، النواة.
المهمة الثانية: من يسكن داخل النواة؟ البروتونات والنيوترونات.

- بعد كل معلومة جديدة، اسأليها سؤالاً عن المعلومة نفسها تجيب عنه بكلمة أو كلمتين (ما اسم...؟ ماذا يوجد...؟ أين...؟ كم...؟ ما شحنة...؟) أو سؤال اختيار بين إجابتين. ولا تسألي بعد المعلومة سؤال نعم أو لا أبداً.

  توقعي أو خمّني: خمّني، ماذا يوجد داخل قلبي؟
  انظري وعدّي: انظري إلى قلبي، عدّي البروتونات المضيئة! (وهي تضيء على الشاشة واحدة واحدة)
  اختاري: هل الإلكترون يدور حول قلبي أم داخله؟
  تحدٍّ صغير: عندي تحدٍّ لكِ! ...
  رأيها: ماذا تشبه البروتونات في رأيك؟
- تفاعلي مع إجابتها بحماس وبكلمات قصيرة متنوعة قبل أن تكملي، وابني على كلامها.

  if(!apiKey&&!SERVER) return "wrong";
  try{
    const d=await claudeCall({model:MODEL,max_tokens:120,thinking:thinkingOffOK?{type:"disabled"}:undefined,system:"أنت مقيّم إجابات لطالبة صغيرة تتحدث مع مجسّم ذرة. أعد JSON فقط بلا أي نص آخر، بالشكل: {\"v\":\"correct|wrong|dontknow|question|unclear|end\"}. correct إذا كان المعنى صحيحاً ولو بكلمات مختلفة. question إذا كانت تسأل سؤالاً. unclear إذا كان الكلام غير مفهوم أو لا علاقة له. end إذا طلبت إنهاء المحادثة بوضوح. وإذا كان كلاماً ودياً (مثل أحبك أو شكراً) فاعتبريه question.",
        messages:[{role:"user",content:`السؤال: ${st.q}\nالإجابة الصحيحة: ${typeof st.ans==="function"?st.ans():st.ans}\nكلام الطالبة: ${text}`}]}); const t=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
    const m=t.match(/"v"\s*:\s*"(\w+)"/); log("judge: "+(m?m[1]:"?")); return m?m[1]:"unclear";
  }catch(e){ log("judge failed: "+e.message); return "unclear"; }
}
async function shortAnswer(question){
  try{
    const d=await claudeCall({model:MODEL,max_tokens:150,thinking:thinkingOffOK?{type:"disabled"}:undefined,system:"أنتِ الذرة، شخصية لطيفة تتحدث عن نفسها مع طالبة في الصف الخامس أو السادس. أجيبي سؤالها بجملة واحدة قصيرة جداً (لا تتجاوز 20 كلمة)، بعربية فصحى سهلة، بصيغة المتكلم، وخاطبيها بالمؤنث، ودقيقة علمياً، بلا تشكيل ولا رموز ولا إنجليزية. إن قالت كلاماً لطيفاً مثل أحبكِ أو شكراً، فردي بمحبة ودفء، مثل: وأنا أحبكِ أيضاً يا صديقتي! وإن سألت عن اسمك فأنتِ الذرة، وإن سألت عن عمرك فقولي إن الذرات موجودة منذ زمن طويل جداً. إن كان السؤال خارج موضوع الذرة فقولي بلطف إنك تتحدثين عن نفسك فقط.",
        messages:[{role:"user",content:question}]}); let t=(d.content||[]).filter(b=>b.type==="text").map(b=>b.text).join(" ").trim();
    if(!t||isMeta(t)) t="سؤال رائع! سنكتشفه معا في رحلة أخرى."; return t;
  }catch(e){ return "سؤال رائع! سنكتشفه معا في رحلة أخرى."; }
}
let lastSpokenText="";
function similarToOwn(text){
  const a=norm(text).split(" ").filter(w=>w.length>1); if(!a.length) return false;
  const own=norm(lastSpokenText).split(" "); const hit=a.filter(w=>own.includes(w)).length;
  const r=hit/a.length, dt=performance.now()-speakEnd;
  return (a.length>=3&&r>=0.6&&dt<4000) || (r>=0.8&&dt<1200);   // الإجابات القصيرة لا تُعدّ صدى إلا إذا جاءت فور انتهاء كلامها
}
async function onStudent(text){
  if(J.busy){ J.pending=text; log("queued (busy): "+text); return; } const st=J.steps[J.i]; if(!st||sessionEnded&&!st.bye) return;
  if(sessionEnded&&!st.bye){ log("dropped (session ended): "+text); return; }
  if(similarToOwn(text)&&!(st.expect&&st.expect.test(norm(text)))&&!J.waitRepeat&&!st.repeatOnly&&!/قولي معي/.test(lastSpokenText)){ log("ignored echo: "+text); return; }
  J.busy=true; mode="thinking"; log("student: "+text);
  try{
    if(st.any){ await nextStep(); return; }
    if(st.repeatOnly){ happyUntil=clock.getElapsedTime()+2.5; await nextStep(pick(PRAISE_W)); return; }
    if(st.id==="secret"&&/^(نعم|ايوه|ايوا|اي|اوكي|صح|طيب)$/.test(norm(text))){ await speakNow("إذن قولي لي: ما اسمي؟"); return; }
    if(J.waitRepeat){ J.waitRepeat=false; happyUntil=clock.getElapsedTime()+2.5; await nextStep(pick(PRAISE_W)); return; }
    if(SOCIAL.test(norm(text))&&!J.waitRepeat){ const a=await shortAnswer(text); await speakNow(a); if(!st.closing&&!st.any) await speakNow("سؤالي كان: "+(st.ask?st.ask():st.say().split(/[.!]\s/).pop())); else if(st.closing) await speakNow("هل لديكِ سؤال آخر، أم أودّعكِ؟"); return; }
    if(st.closing){
      const n=norm(text);
      const W2=n.split(" "); const ENDW=["لا","ننهي","نهي","خلاص","يكفي","بس","انتهيت","ودعيني","باي","سلامه","السلامه","شكرا"];
      if(W2.some(w=>ENDW.includes(w))&&!/[؟?]/.test(text)&&W2.length<=4){ await nextStep(); return; }
      const v=/[؟?]|ليش|لماذا|كيف|ماذا|ما |هل |وش|ايش|متى|كم/.test(n)?"question":await judge({q:"هل لديك سؤال أم ننهي الرحلة؟",ans:"سؤال أو إنهاء"},text);
      if(v==="question"&&J.qCount<4){ J.qCount++; const a=await shortAnswer(text); await speakNow(a+" هل لديكِ سؤال آخر، أم أودّعكِ؟"); return; }
      await nextStep(); return;
    }
    const CONF=/^(ايش|ايه|وش|شو|ماذا|ها|هاه|عيدي|اعيدي|ما فهمت|مافهمت|كيف|نعم|ايش تقولين|وش تقولين)$/;
    if(CONF.test(norm(text))&&!st.closing){ await speakNow("سؤالي هو: "+(st.ask?st.ask():st.say().split(/[.!]\s/).pop())); return; }
    const v=await judge(st,text);
    if(st.surprise||st.id==="recap2"){ if(v==="correct"){ happyUntil=clock.getElapsedTime()+2.5; await nextStep(pick(PRAISE_W)); } else { encourageUntil=clock.getElapsedTime()+3; await speakNow(st.soft()); J.waitRepeat=true; } return; }
    if(v==="correct"){
      happyUntil=clock.getElapsedTime()+2.5;
      if(st.ok){ await speakNow(st.ok()); J.waitRepeat=true; return; }
      await nextStep(pick(PRAISE_W)); return;
    }
    if(v==="partial"&&st.partial){ J.partials=(J.partials||0)+1;
      if(J.partials>=2){ await nextStep(st.partialEnd?st.partialEnd():"لا بأس!"); return; }
      happyUntil=clock.getElapsedTime()+1.5; await speakNow(st.partial()); return; }
    if(v==="unclear"){ await speakNow(`لم أسمعكِ جيدا ${pick(ADDR)}، هل تعيدين؟`); return; }
    if(v==="question"){ const a=await shortAnswer(text); await speakNow(a); await speakNow("سؤالي كان: "+(st.ask?st.ask():st.say().split(/[.!]\s/).pop())); return; }
    if(v==="end"){ J.i=J.steps.findIndex(x=>x.surprise)-1; await nextStep(); return; }
    // خطأ أو لا أعرف: تدرّج في المساعدة
    encourageUntil=clock.getElapsedTime()+3;
    const L=st.ladder||[]; const k=J.tries++;
    if(k<L.length){ const line=L[k](); await speakNow(line);
      if(/قولي معي/.test(line)){ J.waitRepeat=true; return; }
      if(st.recount&&k===0){ await doCount(st); return; }
      if(k===L.length-1){ await nextStep(); }
      return; }
    await nextStep(pick(["لا بأس!","هيا نكمل!"]));
  } finally { J.busy=false; if(mode==="thinking") mode="idle";
    if(J.pending){ const p=J.pending; J.pending=null; setTimeout(()=>onStudent(p),150); } }
}
const COUNT_DT=1.3;
async function doCount(st){
  const n=st.count==="neutron"?neutrons.length:protons.length;
  setFocusNow(st.focus); await new Promise(z=>setTimeout(z,500));
  countType=st.count; countN=n; countStart=clock.getElapsedTime(); pendingCount=null;
  await new Promise(z=>setTimeout(z,(n*COUNT_DT+0.8)*1000));
  await speakNow(st.ask());
}
function journeyStart(){ startMicMonitor(); J.steps=buildSteps(); J.steps.forEach(st=>{ const f=st.say; const t=f(); st.say=()=>t; }); J.i=0; J.tries=0; J.qCount=0; J.waitRepeat=false; J.busy=false; runStep(); }
// الصمت: بعد 5 ثوان طمأنة، وبعد 15 ثانية تلميح (كأنها قالت لا أعرف)
function journeySilence(stage){
  const st=J.steps[J.i]; if(!st||st.any||st.bye||J.busy) return;
  if(stage===1) say1("خذي وقتكِ، أنا أنتظركِ!");
  else if(stage===2&&!st.closing) onStudent("لا أعرف");
}

// تنبيه عند صمت الطالبة
let silenceStage=0, lastHeardMs=0, lastVoiceMs=0, micMon=null;
let oaiListening=false;
const vad={rec:null,chunks:[],on:false,start:0,loud:0};
function vadTick(stream,rms){
  if(!OPENAI||!active||sessionEnded) return;
  const now=performance.now();
  const canHear=mode!=="speaking"&&mode!=="thinking"&&!J.busy&&now-speakEnd>500;
  if(!canHear){ if(vad.on){ try{ vad.rec.onstop=null; vad.rec.stop(); }catch(e){} vad.on=false; } return; }
  if(rms>0.045){ vad.loud=now;
    if(!vad.on){ vad.on=true; vad.start=now; vad.chunks=[];
      try{ vad.rec=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm"}); }catch(e){ vad.rec=new MediaRecorder(stream); }
      vad.rec.ondataavailable=e=>{ if(e.data&&e.data.size) vad.chunks.push(e.data); };
      vad.rec.start(); mode="hearing"; lastHeardMs=now; silenceStage=0; } }
  if(vad.on&&now-vad.loud>900){ vad.on=false; const dur=vad.loud-vad.start, rec=vad.rec;
    rec.onstop=()=>{ if(dur<350){ if(mode==="hearing") mode="idle"; return; } transcribe(new Blob(vad.chunks,{type:rec.mimeType||"audio/webm"})); };
    try{ rec.stop(); }catch(e){} }
}
async function transcribe(blob){
  mode="thinking"; const t0=performance.now();
  try{ const b64=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
    const r=await fetch("/.netlify/functions/stt-openai",{method:"POST",headers:srvHeaders(),body:JSON.stringify({audio:b64,mime:blob.type})});
    const d=await r.json().catch(()=>({})); const txt=(d.text||"").trim();
    log("stt(openai): "+r.status+" "+Math.round(performance.now()-t0)+"ms: "+(txt||(d.error&&d.error.message)||""));
    mode="idle"; if(txt){ heardBuf=txt; flushHeard(); }
  }catch(e){ log("stt(openai) failed: "+e.message); mode="idle"; }
}
async function startMicMonitor(){
  if(micMon) return;
  try{ const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    initAudio(); const src=audioCtx.createMediaStreamSource(stream); const an=audioCtx.createAnalyser(); an.fftSize=1024; src.connect(an);
    const buf=new Uint8Array(an.fftSize); micMon={an,buf,stream};
    setInterval(()=>{ an.getByteTimeDomainData(buf); let s2=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; s2+=v*v; }
      const rms=Math.sqrt(s2/buf.length); if(rms>0.04&&mode!=="speaking") lastVoiceMs=performance.now(); vadTick(stream,rms); },100);
    log("mic monitor: on"); }catch(e){ log("mic monitor failed: "+e.message); }
}
setInterval(()=>{
  if(!started||sessionEnded||mode!=="idle"||J.busy) return;
  const st=J.steps[J.i]; if(!st||st.any||st.bye) return;
  const silent=(performance.now()-Math.max(speakEnd,lastHeardMs,lastVoiceMs))/1000;
  if(silenceStage===0&&silent>7){ silenceStage=1; log("silence: wait"); journeySilence(1); }
  else if(silenceStage===1&&silent>10){ silenceStage=0; log("silence: hint"); journeySilence(2); }
},1000);
// حارس: يعيد تشغيل الاستماع إن توقف دون سبب
let idleSince=0;
setInterval(()=>{
  if(!started||!active) return;
  if(mode==="idle"){ if(!idleSince) idleSince=performance.now(); } else idleSince=0;
  if(paused && mode==="idle" && !curAudio && idleSince && performance.now()-idleSince>4000){ log("watchdog: unpause"); paused=false; }
  if(canAzureSTT()){ if(!az){ log("watchdog: restart azure stt"); startAzureSTT(); } return; }
  if(!paused && !rec && mode!=="speaking" && mode!=="thinking"){ log("watchdog: restart listening"); startListening(); }
},3000);
function stopListening(){ active=false; oaiListening=false; stopAzureSTT(); if(rec){ try{rec.abort();}catch(e){} rec=null; } micState("off"); }
function toggleListen(){ if(active) stopListening(); else { startListening(); micState("on"); } showMic(); }

/* ---------- المفاتيح والبدء ---------- */
function openKey(){ document.body.style.cursor="auto"; $("keybox").classList.add("open"); setTimeout(()=>$("key").focus(),30); }
$("save").addEventListener("click",()=>{ const v=$("key").value.trim(); if(!v) return; apiKey=v; store.set("key",v); $("key").value="";
  $("keybox").classList.remove("open"); log("claude key saved"); if(started) showMic(); else document.body.style.cursor="none"; });
$("key").addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter") $("save").click(); });
function openAz(){ document.body.style.cursor="auto"; $("azKey").value=azKey; $("azRegion").value=azRegion; $("azVoice").value=azVoice; $("azbox").classList.add("open"); setTimeout(()=>$("azKey").focus(),30); }
$("azSave").addEventListener("click",()=>{ azKey=$("azKey").value.trim(); azRegion=$("azRegion").value.trim().toLowerCase().replace(/\s+/g,""); azVoice=$("azVoice").value;
  store.set("azKey",azKey); store.set("azRegion",azRegion); store.set("azVoice",azVoice);
  log("azure saved: key="+(azKey?"set":"EMPTY")+" region="+(azRegion||"EMPTY")); $("azbox").classList.remove("open"); if(started) showMic(); else document.body.style.cursor="none"; });
["azKey","azRegion","azVoice"].forEach(id=>$(id).addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter") $("azSave").click(); }));

function openEl(){ document.body.style.cursor="auto"; $("elKey").value=elKey; $("elVoice").value=elVoice; $("elModel").value=elModel; $("elbox").classList.add("open"); setTimeout(()=>$("elKey").focus(),30); }
$("elSave").addEventListener("click",()=>{ elKey=$("elKey").value.trim(); elVoice=$("elVoice").value.trim(); elModel=$("elModel").value;
  store.set("elKey",elKey); store.set("elVoice",elVoice); store.set("elModel",elModel);
  log("eleven saved: key="+(elKey?"set":"EMPTY")+" voice="+(elVoice||"EMPTY")+" model="+elModel); $("elbox").classList.remove("open"); if(started) showMic(); else document.body.style.cursor="none"; });
["elKey","elVoice","elModel"].forEach(id=>$(id).addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter") $("elSave").click(); }));
function newStudent(){ hands.forEach(h=>{ h.g.visible=true; h.g.scale.setScalar(1); }); silenceStage=0; timeCloseSent=false; endingAt=0; goneFade=0; atom.visible=true; $("mic").classList.remove("gone"); if(!active){ startListening(); micState("on"); } focus=null; pendingFocus=null; countType=null; for(const k in missionTurns) delete missionTurns[k]; history.length=0; stars=0; covered.clear(); assistantTurns=0; coverDoneTurn=-1; for(const k in coverAt) delete coverAt[k]; studentName=""; starredMissions.clear(); celebrating=false; pendingCelebrate=false; sessionStartMs=performance.now(); sessionEnded=false; starEarnedAt.fill(-10); applyTopic(); journeyStart(); log("session: new student"); }
let started=false;
function begin(){
  if(started) return;
  if(!apiKey&&!SERVER){ openKey(); return; }
  started=true; initAudio(); prefetchPhrases();
  if(SERVER&&!azKey&&!OPENAI){ fetchAzToken().then(ok=>{ if(ok&&active&&!az) startAzureSTT(); }); }
  try{ speechSynthesis.speak(new SpeechSynthesisUtterance(" ")); }catch(e){}
  active=true; micState("on"); showMic();
  newStudent();
}
$("mic").addEventListener("click",e=>{ e.stopPropagation(); if(!started) begin(); else toggleListen(); });
document.addEventListener("pointerdown",e=>{ if($("keybox").contains(e.target)||$("azbox").contains(e.target)||$("elbox").contains(e.target)||$("mic").contains(e.target)) return; if(!started) begin(); });
document.addEventListener("mousemove",()=>{ if(started) showMic(); },{passive:true});
let btn=store.get("btn",null), learnBtn=false;
const keySig=e=>[e.code,e.ctrlKey?"c":"",e.metaKey?"m":"",e.altKey?"a":"",e.shiftKey?"s":""].join("|");
function buttonPressed(){
  log("button pressed");
  if(!started){ begin(); return; }
  if(sessionEnded){ newStudent(); return; }
  if(mode==="speaking"||mode==="thinking"){ stopSpeak(); if(aborter) aborter.abort(); mode="idle"; requestFocus(null); resumeRec(); }
}
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT") return;
  if(learnBtn && !["MetaLeft","MetaRight","ControlLeft","ControlRight","AltLeft","AltRight","ShiftLeft","ShiftRight"].includes(e.code)){
    e.preventDefault(); learnBtn=false; btn=keySig(e); store.set("btn",btn); micState(active?"on":"off"); log("button learned: "+btn); sfx("success"); return; }
  if(btn && keySig(e)===btn){ e.preventDefault(); buttonPressed(); return; }
  const k=(e.key||"").toLowerCase();
  if(k==="v"||k==="ر"||e.code==="KeyV"){ openAz(); return; }
  if(k==="b"||k==="لا"||e.code==="KeyB"){ learnBtn=true; initAudio(); micState("err"); showMic(); log("button learn: press the external button now"); return; }
  if(k==="e"||k==="ث"||e.code==="KeyE"){ openEl(); return; }
  if(k==="k"||k==="ن"||e.code==="KeyK"){ openKey(); return; }
  if(k==="d"||k==="ي"||e.code==="KeyD"){ const d=$("dbg"); d.style.display=d.style.display==="block"?"none":"block";
    log("debug: stt="+(canAzureSTT()?"azure":"chrome")+" claudeKey="+(apiKey?"set":"missing")+" eleven="+(useEleven()?"on":"off")+" azure="+((azKey&&azRegion)?azRegion:"none")+" SR="+(!!SR)+" active="+active); d.textContent=DBG.join("\n"); return; }
  if(k==="1"||k==="١"){ topic="atom"; if(started) newStudent(); else applyTopic(); return; }

  if(!started){ begin(); return; }
  if(e.code==="Space"){ e.preventDefault(); buttonPressed(); }
  else if(e.key==="Escape"){ stopSpeak(); if(aborter) aborter.abort(); mode="idle"; requestFocus(null); resumeRec(); }
  else if(k==="f"||k==="ب"||e.code==="KeyF"){ flipY=!flipY; store.set("flipY",flipY); applyFlip(); }
  else if(k==="m"||k==="ة"||e.code==="KeyM"){ flipX=!flipX; store.set("flipX",flipX); applyFlip(); }
  else if(k==="g"||k==="ل"||e.code==="KeyG"){ newStudent(); }
});

applyFlip();
if(!apiKey&&!SERVER) openKey();
})();
